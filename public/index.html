<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><meta name="application-name" content="vBoxStock"><meta name="apple-mobile-web-app-title" content="vBoxStock"><title>vBoxStock</title><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/extras.css"><link rel="stylesheet" href="/theme.css"></head>
<body class="auth-pending"><section id="authScreen" class="auth-screen"><div class="auth-card"><div class="brand auth-brand"><img src="/assets/vboxstock-icon-512.png" alt=""><span>vBoxStock</span></div><small class="build-tag" id="buildTagAuth"></small><div id="authBody"></div></div></section><div id="appShell">
<aside class="sidebar"><div class="brand"><img src="/assets/vboxstock-icon-512.png" alt=""><span>vBoxStock</span></div>
<nav class="side-nav"><button class="tab active" data-tab="available"><i class="nav-icon" data-icon="grid"></i><span>Available inventory</span><i class="badge" id="availableBadge">0</i></button><button class="tab" data-tab="sold"><i class="nav-icon" data-icon="receipt"></i><span>Sales history</span><i class="badge" id="soldBadge">0</i></button><button class="tab" data-tab="customers"><i class="nav-icon" data-icon="users"></i><span>Customers</span><i class="badge" id="customerBadge">0</i></button><button class="tab" data-tab="admin"><i class="nav-icon" data-icon="gear"></i><span>Admin</span></button></nav>
<div class="sidebar-spacer"></div>
<span id="storageStatus" class="storage-status connecting" role="status" aria-live="polite"><i></i><b>Connecting to database</b></span>
<div class="sidebar-foot"><small class="signed-in-label">Logged in as</small><div class="user-menu"><span id="currentUser"></span></div><button class="secondary" id="logout">Log out</button><small class="build-tag" id="buildTagHeader"></small></div>
</aside>
<div class="main-col"><header><div class="header-inner"><input id="search" type="search" aria-label="Search inventory, sales, and customers" placeholder="Search UID, SN, MAC, model, customer…"><div class="actions edit-only"><button class="secondary" data-open="receive">＋ Receive product</button><button class="primary" data-open="sell">Record a sale</button></div></div></header>
<main><div class="intro"><h1>Inventory Overview</h1><span id="date"></span></div><section class="stats"><article><span>Available products</span><strong id="availableCount">0</strong><small>Ready to sell</small></article><article><span>Sold this month</span><strong id="soldCount">0</strong><small id="revenue">No sales recorded</small></article><article><span>Inventory value</span><strong id="value">$0</strong><small>Based on purchase cost</small></article></section>
<section class="records"><div id="filterBar" class="filter-bar"></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="rows"></tbody></table><div id="empty" hidden></div></div><div id="adminPanel" hidden></div><footer id="pagination"></footer></section></main>
</div>
</div>
<dialog id="modal"><button class="close" aria-label="Close">×</button><div id="modalBody"></div></dialog><div id="toast" hidden></div><script type="module" src="/app.js"></script></body></html>
